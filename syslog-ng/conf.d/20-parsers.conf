# Conservative parsers: a failed parse never drops the original event.
# FortiGate emits key=value records; values not known in advance remain as
# fortigate.* fields and are therefore still searchable.
parser p_fortigate_payload {
    regexp-parser(
        patterns('^<[0-9]+>(?<payload>.*)$' '^(?<payload>.*)$')
        template("${RAWMSG}")
        prefix("fortigate.")
    );
};

parser p_fortigate_kv {
    kv-parser(
        prefix("fortigate.")
        pair-separator(" ")
        value-separator("=")
        template("${fortigate.payload}")
    );
};

# Postfix and PMG emit several records for one message.  These conservative
# parsers enrich each record independently; mail.queue_id is the correlation
# key used by OpenObserve queries.  A non-match leaves the event untouched.
parser p_mail_queue_id {
    regexp-parser(
        patterns('^[ ]*(?<queue_id>[A-F0-9]{5,}):[ ]*(?<detail>.*)$' '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};

parser p_mail_sender {
    regexp-parser(
        patterns('(?:^|[:,;] )from=<(?<sender>[^>]*)>' '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};

parser p_mail_recipient {
    regexp-parser(
        patterns('(?:^|[:,;] )to=<(?<recipient>[^>]*)>' '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};

parser p_mail_sender_domain {
    regexp-parser(
        patterns('^[^@<>]*@(?<sender_domain>[^<> ]+)$' '.*')
        template("${mail.sender}")
        prefix("mail.")
    );
};

parser p_mail_recipient_domain {
    regexp-parser(
        patterns('^[^@<>]*@(?<recipient_domain>[^<> ]+)$' '.*')
        template("${mail.recipient}")
        prefix("mail.")
    );
};

parser p_mail_delivery {
    regexp-parser(
        patterns('(?:^|, )relay=(?<relay>[^,]+)'
                 '(?:^|, )dsn=(?<dsn>[^, ]+)'
                 '(?:^|, )status=(?<status>[^, ]+)'
                 '(?:^|, )delay=(?<delay>[^, ]+)'
                 '(?:^|, )delays=(?<delays>[^, ]+)'
                 '(?:^|, )size=(?<message_size>[0-9]+)'
                 '(?:^|[:,;] )message-id=<(?<message_id>[^>]*)>'
                 'reject: [^:]+: (?<smtp_response_code>[245][0-9]{2})[ -](?<smtp_response>[^;]+)'
                 'NOQUEUE: reject: (?<reject_reason>.*)$'
                 '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};

# The delivery parser stops after its first matching pattern by design, so run
# focused parsers as well for fields that commonly coexist on one Postfix line.
parser p_mail_status {
    regexp-parser(patterns('(?:^|, )status=(?<status>[^, ]+)' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_dsn {
    regexp-parser(patterns('(?:^|, )dsn=(?<dsn>[^, ]+)' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_delay {
    regexp-parser(patterns('(?:^|, )delay=(?<delay>[^, ]+)' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_delays {
    regexp-parser(patterns('(?:^|, )delays=(?<delays>[^, ]+)' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_size {
    regexp-parser(patterns('(?:^|, )size=(?<message_size>[0-9]+)' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_message_id {
    regexp-parser(patterns('(?:^|[:,;] )message-id=<(?<message_id>[^>]*)>' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_client {
    regexp-parser(
        patterns('(?:client|from)=(?<source_hostname>[^\[ ,:]+)?\[(?<source_ip>[0-9a-fA-F:.]+)\]'
                 '(?:client|from) (?<source_hostname>[^\[ ,:]+)?\[(?<source_ip>[0-9a-fA-F:.]+)\]'
                 '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};
parser p_mail_relay_ip {
    regexp-parser(patterns('.*\[(?<destination_ip>[0-9a-fA-F:.]+)\].*' '.*') template("${mail.relay}") prefix("mail."));
};
parser p_mail_spam {
    regexp-parser(
        patterns('(?i)spam(?: score)?[=: ]+(?<spam_score>-?[0-9]+(?:\.[0-9]+)?)'
                 '(?i)(?<spam_action>quarantine|blocked|accepted|rejected).*(?:spam|spamscore)'
                 '(?i)(?<virus_result>virus|malware)[=: ]+(?<virus_name>[^,; ]+)'
                 '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};

# Junos control-plane messages commonly start with a stable uppercase event
# mnemonic. SRX structured security messages expose key/value-style labels.
# Keep these parsers deliberately narrow: unmatched messages remain intact and
# are still useful through syslog.program, message, and raw_message.
parser p_juniper_event {
    regexp-parser(
        patterns('^[ ]*(?<event>[A-Z][A-Z0-9_-]{2,}):[ ]*(?<detail>.*)$' '.*')
        template("${MESSAGE}")
        prefix("juniper.")
    );
};
parser p_juniper_interface {
    regexp-parser(
        patterns('(?i)(?:interface|ifname)[ =:]+(?<interface>(?:ge|xe|et|ae|irb|lo|reth|st|fxp|em|gr|lt|vlan)[-0-9/.]+)' '.*')
        template("${MESSAGE}")
        prefix("juniper.")
    );
};
parser p_juniper_routing_instance {
    regexp-parser(
        patterns('(?i)(?:routing-instance|routing instance|instance)[ =:]+(?<routing_instance>[A-Za-z0-9_.:-]+)' '.*')
        template("${MESSAGE}")
        prefix("juniper.")
    );
};
parser p_juniper_peer {
    regexp-parser(
        patterns('(?i)(?:peer|neighbor)[ =:]+(?<peer_ip>[0-9a-f:.]+)' '.*')
        template("${MESSAGE}")
        prefix("juniper.")
    );
};
parser p_juniper_user {
    regexp-parser(
        patterns('(?i)(?:user|username)[ =:]+(?<username>[A-Za-z0-9_.@-]+)'
                 '(?i)(?:accepted|failed) [^ ]+ for (?:invalid user )?(?<username>[A-Za-z0-9_.@-]+) from'
                 '.*')
        template("${MESSAGE}")
        prefix("juniper.")
    );
};
parser p_juniper_source_address {
    regexp-parser(patterns('(?i)(?:source-address|source address)[ =:]+(?<source_address>[0-9a-f:.]+)' '.*') template("${MESSAGE}") prefix("juniper."));
};
parser p_juniper_destination_address {
    regexp-parser(patterns('(?i)(?:destination-address|destination address)[ =:]+(?<destination_address>[0-9a-f:.]+)' '.*') template("${MESSAGE}") prefix("juniper."));
};
parser p_juniper_source_port {
    regexp-parser(patterns('(?i)(?:source-port|source port)[ =:]+(?<source_port>[0-9]+)' '.*') template("${MESSAGE}") prefix("juniper."));
};
parser p_juniper_destination_port {
    regexp-parser(patterns('(?i)(?:destination-port|destination port)[ =:]+(?<destination_port>[0-9]+)' '.*') template("${MESSAGE}") prefix("juniper."));
};
parser p_juniper_policy {
    regexp-parser(patterns('(?i)(?:policy-name|policy name)[ =:]+(?<policy>[A-Za-z0-9_.:-]+)' '.*') template("${MESSAGE}") prefix("juniper."));
};
parser p_juniper_source_zone {
    regexp-parser(patterns('(?i)(?:source-zone-name|source zone)[ =:]+(?<source_zone>[A-Za-z0-9_.:-]+)' '.*') template("${MESSAGE}") prefix("juniper."));
};
parser p_juniper_destination_zone {
    regexp-parser(patterns('(?i)(?:destination-zone-name|destination zone)[ =:]+(?<destination_zone>[A-Za-z0-9_.:-]+)' '.*') template("${MESSAGE}") prefix("juniper."));
};
parser p_juniper_protocol {
    regexp-parser(patterns('(?i)(?:protocol-name|protocol)[ =:]+(?<protocol>[A-Za-z0-9_.:-]+)' '.*') template("${MESSAGE}") prefix("juniper."));
};
parser p_juniper_session {
    regexp-parser(patterns('(?i)(?:session-id|session id)[ =:]+(?<session_id>[0-9]+)' '.*') template("${MESSAGE}") prefix("juniper."));
};

# Proxmox VE services mostly emit normal Debian syslog. These focused parsers
# add useful task/authentication/guest fields without assuming a proprietary
# format for every pvedaemon, HA, corosync, systemd, or kernel message.
parser p_proxmox_auth {
    regexp-parser(
        patterns('(?i)(?<authentication_result>authentication failure)'
                 '(?i)(?<authentication_result>failed|accepted) (?:password|publickey)'
                 '(?i)(?:authentication|login)[^;:]*(?<authentication_result>failed|failure|denied|accepted|successful|success)'
                 '(?i)(?<authentication_result>successful auth) for user'
                 '.*')
        template("${MESSAGE}")
        prefix("proxmox.")
    );
};
parser p_proxmox_user {
    regexp-parser(
        patterns('(?i)(?:user=|user |for )(?:invalid user )?(?<user>[A-Za-z0-9_.@-]+)' '.*')
        template("${MESSAGE}")
        prefix("proxmox.")
    );
};
parser p_proxmox_source {
    regexp-parser(
        patterns('(?i)(?:rhost=|from |client[ =]+)(?<source_ip>[0-9a-f:.]+)' '.*')
        template("${MESSAGE}")
        prefix("proxmox.")
    );
};
parser p_proxmox_upid {
    regexp-parser(
        patterns('(?<upid>UPID:[^ ]+)' '.*')
        template("${MESSAGE}")
        prefix("proxmox.")
    );
};
parser p_proxmox_upid_fields {
    regexp-parser(
        patterns('^UPID:(?<node>[^:]+):[^:]*:[^:]*:[^:]*:(?<task>[^:]*):(?<vmid>[0-9]*):(?<user>[^:]*):' '.*')
        template("${proxmox.upid}")
        prefix("proxmox.")
    );
};
parser p_proxmox_guest {
    regexp-parser(
        patterns('(?i)(?:vmid[ =:]+|VM[ ]+)(?<vmid>[0-9]+)'
                 '(?i)(?:ctid[ =:]+|CT[ ]+)(?<ctid>[0-9]+)'
                 '(?i)(?<resource>(?:vm|ct):[0-9]+)'
                 '.*')
        template("${MESSAGE}")
        prefix("proxmox.")
    );
};
