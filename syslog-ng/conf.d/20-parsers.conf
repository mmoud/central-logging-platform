# Conservative parsers: a failed parse never drops the original event.
# FortiGate emits key=value records; values not known in advance remain as
# fortigate.* fields and are therefore still searchable.
parser p_fortigate_kv {
    kv-parser(
        prefix("fortigate.")
        pair-separator(" ")
        value-separator("=")
    );
};

# Postfix and PMG emit several records for one message.  These conservative
# parsers enrich each record independently; mail.queue_id is the correlation
# key used by OpenObserve queries.  A non-match leaves the event untouched.
parser p_mail_queue_id {
    regexp-parser(
        patterns('^(?<queue_id>[A-F0-9]{5,}):[ ]*(?<detail>.*)$' '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};

parser p_mail_sender {
    regexp-parser(
        patterns('(?:^|[:,;] )from=<(?<sender>[^>]*)>' '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};

parser p_mail_recipient {
    regexp-parser(
        patterns('(?:^|[:,;] )to=<(?<recipient>[^>]*)>' '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};

parser p_mail_sender_domain {
    regexp-parser(
        patterns('^[^@<>]*@(?<sender_domain>[^<> ]+)$' '.*')
        template("${mail.sender}")
        prefix("mail.")
    );
};

parser p_mail_recipient_domain {
    regexp-parser(
        patterns('^[^@<>]*@(?<recipient_domain>[^<> ]+)$' '.*')
        template("${mail.recipient}")
        prefix("mail.")
    );
};

parser p_mail_delivery {
    regexp-parser(
        patterns('(?:^|, )relay=(?<relay>[^,]+)'
                 '(?:^|, )dsn=(?<dsn>[^, ]+)'
                 '(?:^|, )status=(?<status>[^, ]+)'
                 '(?:^|, )delay=(?<delay>[^, ]+)'
                 '(?:^|, )delays=(?<delays>[^, ]+)'
                 '(?:^|, )size=(?<message_size>[0-9]+)'
                 '(?:^|[:,;] )message-id=<(?<message_id>[^>]*)>'
                 'reject: [^:]+: (?<smtp_response_code>[245][0-9]{2})[ -](?<smtp_response>[^;]+)'
                 'NOQUEUE: reject: (?<reject_reason>.*)$'
                 '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};

# The delivery parser stops after its first matching pattern by design, so run
# focused parsers as well for fields that commonly coexist on one Postfix line.
parser p_mail_status {
    regexp-parser(patterns('(?:^|, )status=(?<status>[^, ]+)' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_dsn {
    regexp-parser(patterns('(?:^|, )dsn=(?<dsn>[^, ]+)' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_delay {
    regexp-parser(patterns('(?:^|, )delay=(?<delay>[^, ]+)' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_delays {
    regexp-parser(patterns('(?:^|, )delays=(?<delays>[^, ]+)' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_size {
    regexp-parser(patterns('(?:^|, )size=(?<message_size>[0-9]+)' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_message_id {
    regexp-parser(patterns('(?:^|[:,;] )message-id=<(?<message_id>[^>]*)>' '.*') template("${MESSAGE}") prefix("mail."));
};
parser p_mail_client {
    regexp-parser(
        patterns('(?:client|from)=(?<source_hostname>[^\[ ,:]+)?\[(?<source_ip>[0-9a-fA-F:.]+)\]'
                 '(?:client|from) (?<source_hostname>[^\[ ,:]+)?\[(?<source_ip>[0-9a-fA-F:.]+)\]'
                 '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};
parser p_mail_relay_ip {
    regexp-parser(patterns('.*\[(?<destination_ip>[0-9a-fA-F:.]+)\].*' '.*') template("${mail.relay}") prefix("mail."));
};
parser p_mail_spam {
    regexp-parser(
        patterns('(?i)spam(?: score)?[=: ]+(?<spam_score>-?[0-9]+(?:\.[0-9]+)?)'
                 '(?i)(?<spam_action>quarantine|blocked|accepted|rejected).*(?:spam|spamscore)'
                 '(?i)(?<virus_result>virus|malware)[=: ]+(?<virus_name>[^,; ]+)'
                 '.*')
        template("${MESSAGE}")
        prefix("mail.")
    );
};
