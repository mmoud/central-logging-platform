# OpenObserve's supported _multi endpoint accepts newline-delimited JSON batches.
# The reliable buffer protects data while the HTTP endpoint is down or restarting.
template t_openobserve_json { template("$(format-json --scope all-nv-pairs)\n"); };

destination d_fortigate {
    http(
        url("http://openobserve:5080/api/$(env ZO_ORG)/fortigate/_multi")
        worker-partition-key("$(env ZO_ORG)")
        method("POST") user("`ZO_HTTP_USER`") password("`ZO_HTTP_PASSWORD`")
        headers("Content-Type: application/x-ndjson") body("$(format-json --scope all-nv-pairs)\n")
        batch-lines(`BATCH_LINES`) batch-bytes(`BATCH_BYTES`) batch-timeout(`BATCH_TIMEOUT_MS`)
        disk-buffer(reliable(yes) dir("/var/lib/syslog-ng/buffer/fortigate") disk-buf-size(`BUFFER_BYTES`) mem-buf-size(10000) prealloc(yes))
    );
};
