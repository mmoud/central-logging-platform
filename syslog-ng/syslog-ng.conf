@version: current

# Generated device routes are intentionally separate so source changes are
# validated before a container restart.  Never edit 45-device-routes.conf by hand.
options {
    use-dns(no);
    use-fqdn(no);
    chain-hostnames(no);
    keep-hostname(yes);
    log-fifo-size(20000);
    flush-lines(0);
    time-reopen(10);
};

@include "/etc/syslog-ng/conf.d/10-sources.conf"
@include "/etc/syslog-ng/conf.d/20-parsers.conf"
@include "/etc/syslog-ng/conf.d/25-runtime.conf"
@include "/etc/syslog-ng/conf.d/30-rewrites.conf"
@include "/etc/syslog-ng/conf.d/40-destinations.conf"
@include "/etc/syslog-ng/conf.d/45-device-routes.conf"
