@version: 4.8

@include "/etc/syslog-ng/conf.d/20-parsers.conf"

options {
    keep-hostname(yes);
    use-dns(no);
    stats(level(0));
};

source s_juniper_test {
    file("/tests/samples/juniper.syslog" flags(store-raw-message) follow-freq(1));
};
source s_proxmox_test {
    file("/tests/samples/proxmox-ve.syslog" flags(store-raw-message) follow-freq(1));
};

destination d_juniper_test {
    file("/dev/stdout" persist-name("juniper-test-output") template("JUNIPER $(format-json --scope nv-pairs)\n"));
};
destination d_proxmox_test {
    file("/dev/stdout" persist-name("proxmox-test-output") template("PROXMOX $(format-json --scope nv-pairs)\n"));
};

log {
    source(s_juniper_test);
    parser(p_juniper_event);
    parser(p_juniper_interface);
    parser(p_juniper_routing_instance);
    parser(p_juniper_peer);
    parser(p_juniper_user);
    parser(p_juniper_source_address);
    parser(p_juniper_destination_address);
    parser(p_juniper_source_port);
    parser(p_juniper_destination_port);
    parser(p_juniper_policy);
    parser(p_juniper_source_zone);
    parser(p_juniper_destination_zone);
    parser(p_juniper_protocol);
    parser(p_juniper_session);
    destination(d_juniper_test);
};

log {
    source(s_proxmox_test);
    parser(p_proxmox_auth);
    parser(p_proxmox_user);
    parser(p_proxmox_source);
    parser(p_proxmox_upid);
    parser(p_proxmox_upid_fields);
    parser(p_proxmox_guest);
    destination(d_proxmox_test);
};
