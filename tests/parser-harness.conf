@version: 4.8

@include "/etc/syslog-ng/conf.d/20-parsers.conf"

options {
    keep-hostname(yes);
    use-dns(no);
    stats(level(0));
};

source s_juniper_test {
    file("/tests/samples/juniper.syslog" flags(store-raw-message) follow-freq(1));
};
source s_proxmox_test {
    file("/tests/samples/proxmox-ve.syslog" flags(store-raw-message) follow-freq(1));
};
source s_pmg_test {
    file("/tests/samples/pmg-headers.syslog" flags(store-raw-message) follow-freq(1));
};
source s_ubersmith_test {
    file("/tests/samples/ubersmith-mail.syslog" flags(store-raw-message) follow-freq(1));
};

destination d_juniper_test {
    file("/dev/stdout" persist-name("juniper-test-output") template("JUNIPER $(format-json --scope nv-pairs)\n"));
};
destination d_proxmox_test {
    file("/dev/stdout" persist-name("proxmox-test-output") template("PROXMOX $(format-json --scope nv-pairs)\n"));
};
destination d_pmg_test {
    file("/dev/stdout" persist-name("pmg-test-output") template("PMG $(format-json --scope nv-pairs)\n"));
};
destination d_ubersmith_test {
    file("/dev/stdout" persist-name("ubersmith-test-output") template("UBERSMITH $(format-json --scope nv-pairs)\n"));
};

log {
    source(s_juniper_test);
    parser(p_juniper_event);
    parser(p_juniper_interface);
    parser(p_juniper_routing_instance);
    parser(p_juniper_peer);
    parser(p_juniper_user);
    parser(p_juniper_source_address);
    parser(p_juniper_destination_address);
    parser(p_juniper_source_port);
    parser(p_juniper_destination_port);
    parser(p_juniper_policy);
    parser(p_juniper_source_zone);
    parser(p_juniper_destination_zone);
    parser(p_juniper_protocol);
    parser(p_juniper_session);
    destination(d_juniper_test);
};

log {
    source(s_pmg_test);
    parser(p_mail_filter_id);
    parser(p_mail_queue_id);
    parser(p_mail_headers);
    parser(p_mail_header_sender);
    parser(p_mail_header_sender_domain);
    parser(p_mail_envelope_sender_domain);
    parser(p_mail_header_recipient_domain);
    parser(p_mail_envelope_recipient_domain);
    parser(p_mail_pmg_message);
    parser(p_mail_pmg_rule);
    parser(p_mail_pmg_processing_time);
    parser(p_mail_sender);
    parser(p_mail_recipient);
    parser(p_mail_sender_domain);
    parser(p_mail_recipient_domain);
    parser(p_mail_delivery);
    parser(p_mail_status);
    parser(p_mail_dsn);
    parser(p_mail_delay);
    parser(p_mail_delays);
    parser(p_mail_size);
    parser(p_mail_message_id);
    parser(p_mail_client);
    parser(p_mail_relay_ip);
    parser(p_mail_spam);
    parser(p_mail_auth_summary);
    parser(p_mail_spf_result);
    parser(p_mail_dkim_result);
    parser(p_mail_dmarc_result);
    parser(p_mail_arc_result);
    parser(p_mail_tls);
    destination(d_pmg_test);
};

log {
    source(s_proxmox_test);
    parser(p_proxmox_auth);
    parser(p_proxmox_user);
    parser(p_proxmox_source);
    parser(p_proxmox_upid);
    parser(p_proxmox_upid_fields);
    parser(p_proxmox_guest);
    destination(d_proxmox_test);
};

log {
    source(s_ubersmith_test);
    parser(p_mail_queue_id);
    parser(p_mail_sender);
    parser(p_mail_recipient);
    parser(p_mail_sender_domain);
    parser(p_mail_recipient_domain);
    parser(p_mail_delivery);
    parser(p_mail_status);
    parser(p_mail_dsn);
    parser(p_mail_delay);
    parser(p_mail_delays);
    parser(p_mail_size);
    parser(p_mail_message_id);
    parser(p_mail_client);
    parser(p_mail_relay_ip);
    parser(p_mail_tls);
    destination(d_ubersmith_test);
};
